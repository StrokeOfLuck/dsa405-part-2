name: Import P2 raw source files

on:
  push:
    paths:
      - ".github/workflows/import-raw-p2.yml"

permissions:
  contents: write

jobs:
  import-raw:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Part 2 repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy pinned 2025 House PTR source files
        shell: bash
        run: |
          set -euo pipefail
          SRC_COMMIT="510945b2b1d600dd90b183858b86419926b81e65"
          rm -rf /tmp/house-ptr-scraper
          git clone --filter=blob:none --no-checkout https://github.com/StrokeOfLuck/house-ptr-scraper.git /tmp/house-ptr-scraper
          git -C /tmp/house-ptr-scraper checkout "$SRC_COMMIT"

          mkdir -p data/raw/2025_pdfs
          cp /tmp/house-ptr-scraper/data/01_pdfs/2025/*.pdf data/raw/2025_pdfs/
          cp /tmp/house-ptr-scraper/data/02_xml_indexes/2025FD.xml data/raw/2025FD.xml

          PDF_COUNT="$(find data/raw/2025_pdfs -maxdepth 1 -type f -name '*.pdf' | wc -l | tr -d ' ')"
          if [ "$PDF_COUNT" != "515" ]; then
            echo "Expected 515 PDFs, found $PDF_COUNT"
            exit 1
          fi

          cat > data/raw/SOURCES.md <<'EOF'
          # Raw data sources

          This folder preserves the raw source material used for DSA 405 Project Milestone 2.

          ## 2025 House Periodic Transaction Reports

          - **Producer:** Office of the Clerk, U.S. House of Representatives
          - **Source:** House financial disclosure / periodic transaction report PDFs
          - **Snapshot:** 515 PDFs archived under the scraper's 2025 source snapshot
          - **Pinned upstream commit:** `510945b2b1d600dd90b183858b86419926b81e65`
          - **Copied into this repository:** 2026-09-25
          - **Location:** `data/raw/2025_pdfs/`
          - **Integrity:** The PDFs are copied byte-for-byte from the pinned scraper snapshot. `2025_pdf_manifest.csv` records filenames, sizes, SHA-256 hashes, and the pinned source commit.
          - **Rule:** Files in `data/raw/` are source data and must not be edited or overwritten by project code.

          ## 2025 House disclosure index

          - **File:** `data/raw/2025FD.xml`
          - **Producer:** Office of the Clerk, U.S. House of Representatives
          - **Snapshot:** copied from the same pinned scraper commit
          - **Copied into this repository:** 2026-09-25

          Working and cleaned derivatives belong outside `data/raw/`. Raw files are retained unchanged so every cleaning decision can be checked against the source.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/2025_pdfs data/raw/2025FD.xml data/raw/SOURCES.md
          if git diff --cached --quiet; then
            echo "Raw source files already present."
            exit 0
          fi
          git commit -m "Add immutable 2025 House PTR raw source files for P2"
          git push
